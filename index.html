<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>todo-kuliah</title>
  </head>
  <body>
  <main class="container">
    <header>
      <h1 id="judul-app"></h1>
      <small id="versi-app"></small>
    </header>
    <form id="form-tugas">
      <input type="hidden" id="id" />
      <input type="text" id="judul" placeholder="Judul tugas" required />
      <input type="text" id="matkul" placeholder="Mata kuliah" required />
      <input type="date" id="deadline" required />
      <select id="prioritas">
        <option>Rendah</option>
        <option selected>Sedang</option>
        <option>Tinggi</option>
      </select>
      <button type="submit" id="btn-simpan">Tambah</button>
      <button type="button" id="btn-batal" hidden>Batal</button>
    </form>
    <ul id="daftar"></ul>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
